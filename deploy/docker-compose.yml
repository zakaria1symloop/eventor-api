# Eventor API — Docker Compose stack.
#
# Run from the REPOSITORY ROOT (backend/), because the api build context is "."
# and the Dockerfile lives in deploy/:
#
#   docker compose -f deploy/docker-compose.yml --env-file .env.production up -d --build
#
# .env.production must sit at the repository root (see deploy/.env.production.example).
# Nginx on the host terminates TLS and proxies to 127.0.0.1:3000 (see deploy/nginx/).

name: eventor

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: eventor-api:latest
    env_file:
      - ../.env.production
    environment:
      # Inside the compose network the DB and Redis are reachable by service name.
      # These override whatever .env.production says, so the same file works for
      # both the Docker path and the PM2 path.
      DB_HOST: mysql
      DB_PORT: "3306"
      STORAGE_ROOT: /data/storage
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Bound to loopback only: the public entry point is nginx on the host.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage-data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mysql:
    image: mysql:8
    command: >-
      --default-time-zone=+00:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - mysql-data:/var/lib/mysql
    # No host port by default — the DB is only reachable from the compose network.
    # Uncomment (loopback only!) for a one-off mysqldump / GUI session, then re-comment.
    # ports:
    #   - "127.0.0.1:3306:3306"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Redis is only used when REDIS_URL is set (BullMQ). With REDIS_URL empty the
    # API runs jobs in-process and this service is simply idle — see the
    # "Switching queues to Redis" section of deploy/README.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional dedicated queue worker ────────────────────────────────────────
  # HEADS UP: the current code has NO standalone worker entrypoint. QueueService
  # (src/queue/queue.service.ts) creates the BullMQ Queue *and* the Worker inside
  # the same Nest process, so simply starting a second container from the same
  # image with `node dist/main` gives you a second API that also consumes jobs.
  # That works (BullMQ shares the "eventor" queue over Redis, concurrency 4 per
  # process), but you must NOT publish its port, and REDIS_URL must be set or the
  # second process would only run its own inline jobs.
  #
  # Before enabling this, prefer adding a real worker bootstrap
  # (NestFactory.createApplicationContext) — then change the command below.
  #
  # worker:
  #   image: eventor-api:latest
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   env_file:
  #     - ../.env.production
  #   environment:
  #     DB_HOST: mysql
  #     STORAGE_ROOT: /data/storage
  #     REDIS_URL: redis://redis:6379
  #     # Different port so the two processes never clash if they ever share a net ns.
  #     PORT: "3010"
  #     SWAGGER_ENABLED: "false"
  #   command: ["node", "dist/main"]
  #   restart: unless-stopped
  #   volumes:
  #     - storage-data:/data/storage

volumes:
  mysql-data:
  storage-data:
  redis-data:
