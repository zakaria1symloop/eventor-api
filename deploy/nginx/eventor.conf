# Eventor — nginx site config.
#
# Install:
#   sudo cp deploy/nginx/eventor.conf /etc/nginx/sites-available/eventor.conf
#   sudo sed -i 's/example\.com/YOURDOMAIN.tld/g' /etc/nginx/sites-available/eventor.conf
#   sudo ln -s /etc/nginx/sites-available/eventor.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# REPLACE every `example.com` placeholder with the real domain. Two hosts:
#   api.example.com    -> Eventor API (NestJS, port 3000), global prefix /api/v1
#   admin.example.com  -> Next.js admin dashboard (port 3001)
#
# TLS: run certbot AFTER the plain :80 blocks below are live and DNS resolves:
#   sudo certbot --nginx -d api.example.com -d admin.example.com
# certbot rewrites the ssl_certificate lines; the placeholders here are what it
# produces, so the file stays valid either way.

# ── Shared gzip settings (put in /etc/nginx/conf.d/gzip.conf if you prefer) ──
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types
  application/json
  application/javascript
  application/x-javascript
  application/xml
  application/rss+xml
  application/vnd.api+json
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
# Never gzip already-compressed uploads (WebP/JPEG/PDF served from STORAGE_ROOT).

# ── real_ip ──────────────────────────────────────────────────────────────────
# The app calls `app.set('trust proxy', 1)` (src/app.setup.ts), so Express takes
# the LAST hop's X-Forwarded-For entry as the client IP. That is correct when
# nginx on this host is the only proxy — which is the assumption here.
#
# If you later put Cloudflare (or any other CDN) in front, nginx itself is no
# longer the origin of the client IP: uncomment and maintain the set_real_ip_from
# ranges below, keep `real_ip_recursive on`, and re-check that `trust proxy 1`
# still matches the number of proxies. Getting this wrong breaks the per-IP
# throttling (THROTTLE_LIMIT / AUTH_THROTTLE_LIMIT / UPLOAD_THROTTLE_LIMIT).
#
# set_real_ip_from 173.245.48.0/20;   # ... full Cloudflare list
# real_ip_header   CF-Connecting-IP;
# real_ip_recursive on;

# Map used for the websocket upgrade (Socket.IO).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Upstreams. Pick ONE of the two server lines in each block.
upstream eventor_api {
  # Host install (PM2) or Docker Compose publishing 127.0.0.1:3000:3000:
  server 127.0.0.1:3000;
  # If nginx itself runs INSIDE the compose network, use the service name instead:
  # server api:3000;
  keepalive 32;
}

upstream eventor_admin {
  server 127.0.0.1:3001;
  keepalive 32;
}

# ── Common proxy headers ─────────────────────────────────────────────────────
# (included by each location below)
# X-Forwarded-For / -Proto / -Host are what `trust proxy 1` reads.

# =============================================================================
#  HTTP -> HTTPS redirects, with the ACME challenge served in the clear
# =============================================================================
server {
  listen 80;
  listen [::]:80;
  server_name api.example.com admin.example.com;

  # certbot --nginx / --webroot writes challenge files here.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =============================================================================
#  api.example.com  ->  Eventor API
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  # Managed by certbot; keep these two includes if certbot created them.
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── Body size ──────────────────────────────────────────────────────────────
  # The largest per-route multipart cap in the code is uploadLimits(25) — 25 MB —
  # used by photo and document upload routes (src/common/http/upload-limits.ts).
  # The application ALSO enforces a smaller, admin-editable cap from the settings
  # table (max_photo_upload_mb, default 10; max_document_upload_mb, default 5),
  # so nginx only needs to stay above the hard 25 MB ceiling. 26m leaves room for
  # multipart framing overhead.
  client_max_body_size 26m;
  client_body_timeout  120s;

  # ── Security headers ───────────────────────────────────────────────────────
  # The app also sends helmet() headers; nginx re-asserts the ones that must be
  # right even on an error page nginx generates itself. `always` = also on 4xx/5xx.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Content-Security-Policy   "frame-ancestors 'none'" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  access_log /var/log/nginx/eventor-api.access.log;
  error_log  /var/log/nginx/eventor-api.error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # ── Socket.IO (namespace /admin, default path /socket.io) ─────────────────
  # NOTE: Socket.IO is NOT under the /api/v1 prefix — setGlobalPrefix only
  # affects HTTP controllers, so the engine.io endpoint stays at /socket.io/.
  location /socket.io/ {
    proxy_pass http://eventor_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Long-lived connections: do not cut idle sockets between pings.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    gzip                off;
  }

  # ── File downloads ────────────────────────────────────────────────────────
  # The dashboard previews photos and PDFs in an iframe from its own origin, so
  # FilesController deliberately drops X-Frame-Options and sends its own
  # `frame-ancestors <dashboard origin>`. An `add_header` in a location block
  # replaces the whole inherited set, so the two framing headers above are simply
  # not repeated here — otherwise DENY / 'none' would win and previews would break.
  location /api/v1/files/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    proxy_pass http://eventor_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    # Stream large files straight through instead of spooling them to disk.
    proxy_buffering off;
  }

  # ── Everything else (REST under /api/v1, Swagger when enabled) ─────────────
  location / {
    proxy_pass http://eventor_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    # Exports (ExcelJS / PDFKit) and large imports can take a while.
    proxy_read_timeout    300s;

    # Streamed downloads (file routes, exports) should not be buffered to disk.
    proxy_buffering       off;
    proxy_request_buffering off;
  }
}

# =============================================================================
#  admin.example.com  ->  Next.js admin dashboard (127.0.0.1:3001)
# =============================================================================
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.example.com;

  ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # The dashboard forwards uploads to the API, so keep the same ceiling.
  client_max_body_size 26m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header Content-Security-Policy   "frame-ancestors 'self'" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  access_log /var/log/nginx/eventor-admin.access.log;
  error_log  /var/log/nginx/eventor-admin.error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # Next.js build assets are content-hashed and immutable.
  location /_next/static/ {
    proxy_pass http://eventor_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Next dev HMR / any websocket the dashboard opens to itself.
  location / {
    proxy_pass http://eventor_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout    300s;
  }
}
